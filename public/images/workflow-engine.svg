  <rect x="390" y="248" width="190" height="60" rx="6" fill="#0a1e1e" stroke="#363636" stroke-width="1"/>
  <text x="406" y="268" font-family="monospace" font-size="9" fill="#f8fafc" opacity="0.6">Success Rate</text>
