  <rect x="20" y="196" width="560" height="18" rx="2" fill="#0f2a2a" opacity="0.5"/>
  <text x="30" y="209" font-family="monospace" font-size="9" fill="#f8fafc" opacity="0.8">WF-20240112-003</text>
  <rect x="196" y="199" width="50" height="12" rx="6" fill="#ff5f5725"/>
  <text x="200" y="209" font-family="monospace" font-size="9" fill="#ff5f57">FAILED</text>
  <text x="310" y="209" font-family="monospace" font-size="9" fill="#7ec8c8">VALIDATE</text>
  <text x="430" y="209" font-family="monospace" font-size="9" fill="#f8fafc" opacity="0.7">0m 08s</text>
  <text x="520" y="209" font-family="monospace" font-size="9" fill="#febc2e">3</text>

  <rect x="20" y="216" width="560" height="18" rx="2"/>
  <text x="30" y="229" font-family="monospace" font-size="9" fill="#f8fafc" opacity="0.8">WF-20240112-004</text>
  <rect x="196" y="219" width="56" height="12" rx="6" fill="#febc2e25"/>
  <text x="200" y="229" font-family="monospace" font-size="9" fill="#febc2e">PENDING</text>
